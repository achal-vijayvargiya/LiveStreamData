[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:websocket]
command=python -m app.websocket.server
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/websocket.err.log
stdout_logfile=/var/log/supervisor/websocket.out.log
environment=
    PORT="%(ENV_PORT)s"

[program:main]
command=python main.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/main.err.log
stdout_logfile=/var/log/supervisor/main.out.log
startretries=5
startsecs=5
# Wait for websocket to start first
depends_on=websocket 